# Tesla sandbox dev allowlist policy
# Phase 3 placeholder only. No runtime enforcement yet.

policy: egress-dev-allowlist
status: placeholder
phase: 3

default:
  network: deny
  dns: controlled
  lan: deny
  cloud: deny

allowlist:
  package_registries:
    - pypi.org
    - files.pythonhosted.org
    - registry.npmjs.org
  source_control:
    - github.com
    - api.github.com
    - raw.githubusercontent.com

requires_validation:
  - new_domains
  - ai_cli_endpoints
  - cloud_endpoints
  - browser_targets
  - external_accounts

markers:
  TESLA_SANDBOX_EGRESS_DEV_ALLOWLIST_DRAFTED: 1
  TESLA_SANDBOX_PHASE_3_ACTIVE: 1
  MAIN_RENDUE_A_MAHONHEIM: 1
