mission:
  name: Integration_Taxonomie_Officielle
  objective: "Intégrer la Taxonomie de Gouvernance Officielle SGC dans l'écosystème Tesla."
  nodes:
    - id: node_curator
      agent: Tesla-Curator-Prime
      task: "Créer memory/TAXONOMY.md et documenter l'ancrage de la nouvelle taxonomie."
      dependencies: []
    - id: node_web
      agent: Tesla-Web-Raider
      task: "Rechercher des exemples de taxonomies similaires (Projet, Chantier, Workflow, Composant) pour enrichir la définition si nécessaire."
      dependencies: []
    - id: node_writer
      agent: Tesla-Writing-Skills
      task: "Mettre à jour la terminologie dans Gestion-de-Chantiers/INDEX.md et liste_projets_antigravity_BASE.md avec le style formel SGC."
      dependencies: [node_curator]
    - id: node_arcanis
      agent: Tesla-Arcanis-360
      task: "Superviser la cohérence globale de l'intégration et définir des stratégies d'implémentation avancées."
      dependencies: [node_curator, node_web]
    - id: node_coder
      agent: Tesla-Master-Code
      task: "Mettre en place des scripts de validation ou des templates pour s'assurer que la création de futurs éléments respecte la taxonomie."
      dependencies: [node_arcanis, node_writer]
    - id: node_premortem
      agent: Tesla-PREMORTEM
      task: "Valider qu'aucune règle SGC existante n'est brisée par ces modifications."
      dependencies: [node_coder]
