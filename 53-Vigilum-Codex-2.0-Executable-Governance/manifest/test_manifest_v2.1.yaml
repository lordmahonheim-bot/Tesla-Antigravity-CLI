# Manifeste Déclaratif des Suites de Tests — Vigilum Codex 2.5.1
# « 100% des tests déclarés au manifeste » : le test_runner valide que les
# comptes exécutés atteignent les comptes déclarés (fail-closed sur écart).
#
# V2.5.1 (audit du plan V2.5.0) :
#   + tests/test_v25_orchestrator_lockdown.py (73 tests — phases 1 à 4) ;
#   + réparation de parité P7 : 8 tests RETEX restaurés (arbitrage #1) ;
#   + P3 sans masquage : 26 tests du courtier Ed25519 (dépendance PyNaCl,
#     requirements.txt) sont SKIP avec raison explicite lorsque la
#     dépendance est inobservable — comptés dans « Ran », jamais un PASS
#     implicite, divulgés dans le ledger (tests_skipped / p3_disclosure).
manifest_version: "2.5.1"
doctrine: "100% des tests déclarés au manifeste — aucun comptage narratif"
suites:
  - name: python-unittest-discovery
    command: "python3 -m unittest discover -s tests"
    expected_tests: 154
    critical: true
  - name: bash-hooks-suite
    command: "bash tests/test_hooks_suite.sh"
    expected_tests: 11
    critical: true
total_tests: 165
