name: Tesla headless integration
on:
  push:
    paths: ['tools/tesla_ai.py', 'tests/test_tesla_ai.py', 'tests/test_spark_gateway.py', '58-Spark-MCP-Gateway/**', '.github/workflows/tesla-headless.yml']
  pull_request:
    paths: ['tools/tesla_ai.py', 'tests/test_tesla_ai.py', 'tests/test_spark_gateway.py', '58-Spark-MCP-Gateway/**', '.github/workflows/tesla-headless.yml']
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r 58-Spark-MCP-Gateway/requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python tools/tesla_ai.py doctor
