name: Governance CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-gate-r:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'
      - name: Run gate_r tests
        run: python3 53-Vigilum-Codex-2.0-Executable-Governance/bin/test_runner.py

  test-ouroboros:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'
      - name: Run ouroboros tests
        run: python3 60-WikiSkill-Ouroboros/scripts/self_test.py

  compile-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'
      - name: Compile all Python files
        run: python3 -m compileall .

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'
      - name: Install linters
        run: pip install ruff==0.16.8
      - name: Run lint
        run: bash 16-Tesla-Master-Code/lint_all.sh

  ci-success-governance:
    if: always()
    needs: [test-gate-r, test-ouroboros, compile-python, lint, gate-r-reconcile]
    runs-on: ubuntu-latest
    steps:
      - name: Évaluer les résultats
        run: |
          echo "gate-r-reconcile = ${{ needs.gate-r-reconcile.result }}"
          for r in "${{ needs.test-gate-r.result }}" "${{ needs.test-ouroboros.result }}" \
                   "${{ needs.compile-python.result }}" "${{ needs.lint.result }}"; do
            [ "$r" = "success" ] || { echo "ECHEC : $r"; exit 1; }
          done

  gate-r-reconcile:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    needs: [test-gate-r]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'
      - name: Gate R Reconcile
        env:
          TESLA_CONTROL_PLANE_KEY: ${{ secrets.TESLA_CONTROL_PLANE_KEY }}
        run: |
          python3 53-Vigilum-Codex-2.0-Executable-Governance/bin/gate_r.py reconcile --root 53-Vigilum-Codex-2.0-Executable-Governance --mission SGC-EXEC-GOV-03-R3 --ledger 53-Vigilum-Codex-2.0-Executable-Governance/evidence/test_runner_SGC-EXEC-GOV-03-R3_20260924-153248-111549.json
