name: mirror-guard
on:
  pull_request:
    paths: ['LEARN/**', 'PROTOCOLES/**', 'AGY-Project-MAIN-LIST.md']
permissions:
  contents: read
jobs:
  souverainete-locale:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::error::LEARN/, PROTOCOLES/ et AGY-Project-MAIN-LIST.md sont des MIROIRS UNIDIRECTIONNELS."
          exit 1
  ci-success:
    needs: [souverainete-locale]
    runs-on: ubuntu-latest
    steps:
      - run: echo "All checks passed"
