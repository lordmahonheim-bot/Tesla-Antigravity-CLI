name: Gitleaks Secret Scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    name: Scan for Secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v2

  ci-success-security:
    needs: [scan]
    runs-on: ubuntu-latest
    steps:
      - run: echo "All checks passed"
