name: Gitleaks Secret Scan

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  scan:
    name: Scan for Secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          # Requis par gitleaks-action v3 pour scanner les pull requests
          # (sans ce jeton, le job échoue sur tout événement pull_request).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ci-success-security:
    needs: [scan]
    runs-on: ubuntu-latest
    steps:
      - run: echo "All checks passed"
